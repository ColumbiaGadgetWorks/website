# Events shown on /events/ and the homepage.
# recurring: always listed. upcoming: dated items, hidden automatically once the date passes.
# Dates are YYYY-MM-DD. Keep this file current; it is the calendar of record for the site.
recurring:
  - title: Open Hack Night
    when: Every Thursday, 6–8 pm
    description: Free and open to the public. Tours, demos, help with your project, and the basic tools. No sign-up needed. Skipped only on major holidays.
  - title: City of Columbia grant classes
    when: First Thursday of the month, Nov 2026 – Oct 2027
    description: A year of free public classes funded by a City of Columbia grant. Topics announced a month ahead.
  - title: Board meeting
    when: Last Thursday of the quarter, 8 pm (after Open Hack Night)
    description: Open to members. Agenda and minutes are posted on the member wiki.
  - title: Annual member meeting
    when: Last Saturday in April
    description: Members elect officers and vote on any bylaw changes.

