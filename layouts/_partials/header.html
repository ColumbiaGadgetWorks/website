<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="/" aria-label="Columbia Gadget Works home">
      <img src="/img/cgw-gear.png" width="40" height="40" alt="">
      <span class="brand-text"><span class="brand-name">Columbia Gadget Works</span><span class="brand-sub">Community makerspace · Columbia, MO</span></span>
    </a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav" onclick="var n=document.getElementById('site-nav');var o=n.classList.toggle('open');this.setAttribute('aria-expanded',o)">
      <span class="bars" aria-hidden="true"></span><span class="sr">Menu</span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Main">
      {{ $cur := . }}
      {{ range site.Menus.main }}
        {{ $active := or ($cur.IsMenuCurrent "main" .) ($cur.HasMenuCurrent "main" .) }}
        <a href="{{ .URL }}" class="{{ if .Params.button }}btn btn-primary{{ else }}nav-link{{ end }}{{ if $active }} active{{ end }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
